name: Déploiement Infomaniak

# À chaque push sur main, le site est envoyé par FTPS sur l'hébergement Infomaniak.
# Prérequis (une seule fois) : ajouter 3 secrets dans le repo GitHub
#   Settings → Secrets and variables → Actions → New repository secret
#     FTP_SERVER    → l'hôte FTP Infomaniak (ex. xxxxxx.ftp.infomaniak.com)
#     FTP_USERNAME  → l'utilisateur FTP
#     FTP_PASSWORD  → le mot de passe FTP
# server-dir : racine web Infomaniak (par défaut /web/ — adapter si le site
# est dans un sous-dossier, ex. /web/adrienthetaz.ch/).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la configuration
        env:
          S: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          U: ${{ secrets.INFOMANIAK_FTP_USERNAME || vars.INFOMANIAK_FTP_USERNAME }}
          P: ${{ secrets.INFOMANIAK_FTP_PASSWORD || vars.INFOMANIAK_FTP_PASSWORD }}
        run: |
          ok=1
          [ -z "$S" ] && { echo "::error::FTP_SERVER introuvable (ni secret ni variable du repo)"; ok=0; }
          [ -z "$U" ] && { echo "::error::INFOMANIAK_FTP_USERNAME introuvable (ni secret ni variable du repo)"; ok=0; }
          [ -z "$P" ] && { echo "::error::INFOMANIAK_FTP_PASSWORD introuvable (ni secret ni variable du repo)"; ok=0; }
          [ "$ok" = 1 ]

      - name: Déployer via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.INFOMANIAK_FTP_USERNAME || vars.INFOMANIAK_FTP_USERNAME }}
          password: ${{ secrets.INFOMANIAK_FTP_PASSWORD || vars.INFOMANIAK_FTP_PASSWORD }}
          protocol: ftps
          server-dir: /web/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
